# Lints every change and regenerates indexes on main. See the Lore TECH_STACK, section 6.
name: kb
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  packages: read
env:
  KB: npx -y {{CLI_PACKAGE}}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "{{CLI_SCOPE}}"
      - run: $KB lint --format github,human
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  index:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "{{CLI_SCOPE}}"
      - run: $KB index
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit regenerated files
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "lore-bot"
            git config user.email "lore-bot@users.noreply.github.com"
            git commit -m "kb: regenerate indexes [skip ci]"
            git push
          fi
